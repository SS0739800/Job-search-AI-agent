# Company registry.
#
# Only add a board_id after confirming it against the live API, e.g.:
#   python -m app.cli verify-companies
#
# Fields:
#   name         Display name
#   ats          greenhouse | lever | ashby
#   board_id     Identifier in the ATS public API URL
#   careers_url  Employer's public careers page
#   active       false = keep in the registry but skip during searches
#
# Greenhouse entries below were verified on 2026-11-16 (API returned 200 with postings).

companies:
  - name: MongoDB
    ats: greenhouse
    board_id: mongodb
    careers_url: https://www.mongodb.com/company/careers/teams
    active: true

